<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>relay-edge hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  relay-edge-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:80px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Synthetic edge event generator</span></div>
  <div class="word">relay-edge</div>
  <div class="tag">Real sites, simulated.<br><em>Stamped events into Relay.</em></div>
  <div class="lede">Site topology, four IoT simulators and stamped events that publish into Zyvor Relay, with browser control rooms.</div>
  <div class="stats"><div class="stat"><b>77</b><span>sim devices</span></div><div class="stat"><b>18</b><span>edge classes</span></div><div class="stat"><b>4</b><span>event families</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/relay-edge</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// relay-edge: four IoT simulators on a site map emit ripple waves that interfere; stamped events fly to Relay.
var C = Z.c;
var defs = Z.el('defs', {});
defs.innerHTML = '<filter id="re-gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="re-sf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>' +
  '<radialGradient id="re-relay"><stop offset="0" stop-color="#64d2ff" stop-opacity=".6"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="re-fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity="1"/><stop offset=".94" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
  '<linearGradient id="re-fadev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".07" stop-color="#fff" stop-opacity="1"/><stop offset=".93" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
  '<mask id="re-mh" maskUnits="userSpaceOnUse" x="0" y="0" width="680" height="630"><rect width="680" height="630" fill="url(#re-fade)"/></mask>' +
  '<mask id="re-mv" maskUnits="userSpaceOnUse" x="0" y="0" width="680" height="630"><rect width="680" height="630" fill="url(#re-fadev)"/></mask>';

// faint site grid (zones)
var grid = Z.g({ opacity: .5 });
for (var x = 120; x <= 640; x += 40) Z.el('line', { x1: x, y1: 40, x2: x, y2: 590, stroke: 'rgba(120,185,255,.07)' }, grid);
for (var y = 40; y <= 590; y += 40) Z.el('line', { x1: 120, y1: y, x2: 640, y2: y, stroke: 'rgba(120,185,255,.07)' }, grid);

var sims = [
  { n: 'farm', x: 200, y: 150, c: C.green, lx: 0, ly: -30 },
  { n: 'firewater', x: 380, y: 112, c: C.cyan, lx: 0, ly: -30 },
  { n: 'remote-edge', x: 190, y: 400, c: C.violet, lx: 0, ly: 32 },
  { n: 'fleet', x: 360, y: 470, c: C.teal, lx: 0, ly: 32 }
];
var relay = { x: 548, y: 300 };

// ripple waves with additive blending -> interference pattern
var waves = Z.el('g', { style: 'mix-blend-mode:screen' }, Z.el('g', { mask: 'url(#re-mv)' }, Z.g({ mask: 'url(#re-mh)' })));
sims.forEach(function (s) {
  for (var r = 14; r < 300; r += 15) {
    var op = Math.max(0, 0.55 * (1 - r / 300));
    Z.el('circle', { cx: s.x, cy: s.y, r: r, fill: 'none', stroke: s.c, 'stroke-width': 1.3, opacity: op.toFixed(3) }, waves);
  }
});

// relay halo
Z.el('circle', { cx: relay.x, cy: relay.y, r: 120, fill: 'url(#re-relay)', opacity: .7 });

// event paths from each simulator to Relay, with stamped event tiles along them
sims.forEach(function (s, k) {
  var mx = (s.x + relay.x) / 2 + (s.y < relay.y ? 30 : 30), my = (s.y + relay.y) / 2 + (s.y < relay.y ? -40 : 40);
  var d = 'M' + s.x + ',' + s.y + ' Q' + mx + ',' + my + ' ' + relay.x + ',' + relay.y;
  var p = Z.el('path', { d: d, fill: 'none', stroke: s.c, 'stroke-width': 1.2, 'stroke-dasharray': '3 5', opacity: .55 });
  var L = p.getTotalLength();
  [0.42, 0.68].forEach(function (t, j) {
    var pt = p.getPointAtLength(L * t), pt2 = p.getPointAtLength(L * t - 2);
    var ang = Math.atan2(pt.y - pt2.y, pt.x - pt2.x) * 180 / Math.PI;
    // motion trail
    var tail = p.getPointAtLength(Math.max(0, L * t - 46));
    Z.el('line', { x1: tail.x, y1: tail.y, x2: pt.x, y2: pt.y, stroke: s.c, 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .35 });
    var gg = Z.g({ transform: 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')', filter: 'url(#re-gl)' });
    // envelope-like event card with perforated stamp edge
    Z.el('rect', { x: -10, y: -7, width: 20, height: 14, rx: 2, fill: 'rgba(8,14,26,.95)', stroke: s.c, 'stroke-width': 1.4 }, gg);
    Z.el('rect', { x: -7, y: -4, width: 14, height: 8, rx: 1, fill: 'none', stroke: '#fff', 'stroke-width': .8, 'stroke-dasharray': '1.5 1.5', opacity: .8 }, gg);
    Z.el('circle', { cx: 0, cy: 0, r: 1.6, fill: s.c }, gg);
  });
});

// simulator nodes
sims.forEach(function (s) {
  Z.el('circle', { cx: s.x, cy: s.y, r: 22, fill: s.c, opacity: .18, filter: 'url(#re-sf)' });
  Z.el('circle', { cx: s.x, cy: s.y, r: 11, fill: 'rgba(6,10,18,.95)', stroke: s.c, 'stroke-width': 2, filter: 'url(#re-gl)' });
  Z.el('circle', { cx: s.x, cy: s.y, r: 4, fill: '#fff' });
  Z.label(s.x + s.lx, s.y + s.ly, '<span style="margin:0;color:' + s.c + '">' + s.n + '</span>');
});

// Relay node: stacked rings
for (var i = 0; i < 3; i++) Z.el('circle', { cx: relay.x, cy: relay.y, r: 58 + i * 12, fill: 'none', stroke: 'rgba(100,210,255,' + (0.35 - i * 0.1) + ')', 'stroke-width': 1, 'stroke-dasharray': i === 1 ? '2 5' : 'none' });
Z.el('circle', { cx: relay.x, cy: relay.y, r: 46, fill: 'rgba(6,10,18,.94)', stroke: C.signal, 'stroke-width': 2, filter: 'url(#re-gl)' });
Z.label(relay.x, relay.y, '<b>Relay</b><span>accept</span>');

// sparse telemetry dust
for (var i = 0; i < 40; i++) {
  var x = 110 + Z.rnd() * 520, y = 40 + Z.rnd() * 550;
  Z.el('circle', { cx: x, cy: y, r: .8 + Z.rnd() * 1.2, fill: C.cyan, opacity: (0.1 + Z.rnd() * 0.35).toFixed(2) });
}
Z.label(548, 560, 'stamp &middot; publish &middot; SSE', 'chip');
})();
</script>
</body>
</html>
